<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fields of Silk — Kettle Forge Studios</title>
<meta name="theme-color" content="#14090a">
<link rel="icon" href="/kernelcade-icon.png">
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #14090a; color: #fff1dc; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  header, footer { padding: 10px max(16px, env(safe-area-inset-left)); }
  header { display: flex; gap: 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid #543027; }
  h1 { font-size: 1.05rem; margin: 0; }
  a { color: #ffd476; }
  main { display: grid; justify-items: center; gap: 10px; margin: 0 auto; padding: 10px; }
  #screen { width: min(100%, 512px, calc((100svh - 260px) * 256 / 240)); min-width: min(100%, 224px); aspect-ratio: 256 / 240; background: #000; }
  .controls { width: min(100%, 480px); display: flex; justify-content: space-between; align-items: center; gap: 8px; touch-action: none; user-select: none; }
  [data-input] { min-height: 43px; min-width: 42px; font: inherit; font-weight: 700; color: inherit; background: #382220; border: 1px solid #784d3a; border-radius: 9px; touch-action: none; }
  [data-input]:active, [data-input].held { background: #754236; }
  .dpad { display: grid; grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 43px); }
  [data-input="UP"] { grid-area: 1 / 2; }
  [data-input="LEFT"] { grid-area: 2 / 1; }
  [data-input="RIGHT"] { grid-area: 2 / 3; }
  [data-input="DOWN"] { grid-area: 3 / 2; }
  .face { display: flex; gap: 10px; }
  .face button { width: 56px; height: 56px; border-radius: 50%; background: #8b302a; }
  .meta { display: flex; gap: 10px; }
  .meta button { min-height: 35px; padding: 0 10px; }
  #status:empty { display: none; }
  footer { color: #ccb9a6; font-size: .875rem; text-align: center; }
  @media (orientation: landscape) and (max-height: 520px) {
    main { grid-template: "left game right" auto ". meta ." auto / 1fr auto 1fr; align-items: center; }
    #screen { grid-area: game; width: min(100%, calc((100svh - 105px) * 256 / 240)); }
    .controls { display: contents; }
    .dpad { grid-area: left; }
    .face { grid-area: right; }
    .meta { grid-area: meta; }
    #status { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <h1>Fields of Silk <small>· 8-Bit Alpha</small></h1>
  <a href="/#kettle-classics">Kettle Classics</a>
</header>
<main>
  <div id="screen" aria-label="Fields of Silk game screen"></div>
  <p id="status" role="status">Loading Fields of Silk…</p>
  <div class="controls" aria-label="On-screen controls">
    <div class="dpad">
      <button type="button" data-input="UP" aria-label="Up">▲</button>
      <button type="button" data-input="LEFT" aria-label="Left">◀</button>
      <button type="button" data-input="RIGHT" aria-label="Right">▶</button>
      <button type="button" data-input="DOWN" aria-label="Down">▼</button>
    </div>
    <div class="face">
      <button type="button" data-input="B" aria-label="B, reel in silk">B</button>
      <button type="button" data-input="A" aria-label="A, anchor silk">A</button>
    </div>
  </div>
  <div class="meta">
    <button type="button" data-input="SELECT">Select</button>
    <button type="button" data-input="START">Start</button>
  </div>
</main>
<footer>
  Arrows move · X anchors silk · Hold Z to reel in · Enter pauses
  <br><a href="/assets/play/fields-of-silk.nes" download>Download NES ROM</a>
  · <a href="/assets/play/jsnes-license.txt">JSNES license</a>
</footer>
<script src="/assets/play/jsnes-3.0.0.min.js" defer></script>
<script src="/assets/play/fields-of-silk-web.js" defer></script>
</body>
</html>
