<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Husk OS placeholder: an ear of corn still wrapped in its husk, in Kettle Forge red/gold/cream -->
  <rect width="64" height="64" rx="14" fill="#3a1c1f"/>
  <g fill="none" stroke="#FFF7EC" stroke-width="1.6" stroke-linecap="round">
    <path d="M32 11c-1-3-3-5-6-5"/><path d="M32 11c0-3 1-5 3-7"/><path d="M32 11c2-2 4-3 7-3"/>
  </g>
  <!-- cob -->
  <path d="M32 10c6 0 8 10 8 22s-3 22-8 22-8-10-8-22 2-22 8-22z" fill="#FFC933"/>
  <g fill="#E0A21E"><circle cx="32" cy="16" r="1.5"/><circle cx="32" cy="21" r="1.5"/><circle cx="32" cy="26" r="1.5"/><circle cx="32" cy="31" r="1.5"/></g>
  <!-- husk: outer leaves wrap up both sides, tips peel out at the top -->
  <path d="M32 58c-8 0-14-8-14-22 0-10 2-18 5-24 2 6 4 14 6 22 1 8 2 16 3 24z" fill="#A80F17"/>
  <path d="M32 58c8 0 14-8 14-22 0-10-2-18-5-24-2 6-4 14-6 22-1 8-2 16-3 24z" fill="#7E0B12"/>
  <!-- inner leaves, lighter, overlapping the cob -->
  <path d="M32 58c-6-2-9-10-9-20 0-7 1-13 3-17 3 7 5 16 6 37z" fill="#F0303A"/>
  <path d="M32 58c6-2 9-10 9-20 0-7-1-13-3-17-3 7-5 16-6 37z" fill="#DC141E"/>
  <g fill="none" stroke="#7E0B12" stroke-width="1" stroke-linecap="round" opacity=".6">
    <path d="M26 26c1 10 3 20 5 29"/><path d="M38 26c-1 10-3 20-5 29"/>
  </g>
</svg>
